<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>奧丁：神叛 模擬器 (2026 Edition)</title>
  <meta name="description" content="高品質的奧丁神叛模擬器，包含裝備強化與抽卡模擬功能。" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div id="app">
    <header>
      <h1 class="title">奧丁：神叛 模擬器 (娛樂用)</h1>
      <div class="links">
        <a target="_blank" href="https://github.com/sibyllae/ODIN-Simulator">GitHub Repo</a>
      </div>
    </header>

    <div class="glass-panel text-center">
      <select id="mode-select">
        <option value="default">選擇衝裝 / 抽卡</option>
        <option value="equipment">我要衝裝</option>
        <option value="card">我要抽卡</option>
      </select>
    </div>

    <!-- Equipment Section -->
    <main id="equipment-section" class="glass-panel" style="display: none;">
      <div class="status-header">
        <h2 id="accum-equipment-label">目前累積強化 0 次</h2>
        <button id="reset-equip-btn" class="btn-outline">Reset</button>
      </div>

      <div class="controls-group">
        <select id="equip-select">
          <option value="default">選擇道具</option>
          <option value="arms">武器</option>
          <option value="equip">裝備</option>
          <option value="cloak">披風</option>
          <option value="accessory">飾品</option>
          <option value="blackAccessory">商城飾品</option>
        </select>

        <select id="now-lv-select">
          <option value="default">目前等級</option>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
          <option value="16">16</option>
          <option value="17">17</option>
          <option value="18">18</option>
          <option value="19">19</option>
        </select>

        <select id="target-lv-select">
          <option value="default">目標等級</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
          <option value="16">16</option>
          <option value="17">17</option>
          <option value="18">18</option>
          <option value="19">19</option>
          <option value="20">20</option>
        </select>

        <input id="equip-count-input" type="number" placeholder="輸入數量" min="1" />
        <button id="start-equip-btn">開始強化</button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>強化等級</th>
              <th>成功</th>
              <th>失敗</th>
              <th>機率</th>
            </tr>
          </thead>
          <tbody id="equip-result-tbody">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
    </main>

    <!-- Card Section -->
    <main id="card-section" class="glass-panel" style="display: none;">
      <div class="status-header">
        <h2 id="accum-card-label">目前累積花費 0 元台幣</h2>
        <button id="reset-card-btn" class="btn-outline">Reset</button>
      </div>

      <h3 style="text-align: center; margin-bottom: 1rem; color: var(--text-secondary);">目前累積卡片</h3>
      <div class="summary-grid">
        <div class="summary-card">
          <span>白</span>
          <strong id="summary-white" class="text-white">0</strong>
        </div>
        <div class="summary-card">
          <span>綠</span>
          <strong id="summary-green" class="text-green">0</strong>
        </div>
        <div class="summary-card">
          <span>藍</span>
          <strong id="summary-blue" class="text-blue">0</strong>
        </div>
        <div class="summary-card">
          <span>紫</span>
          <strong id="summary-purple" class="text-purple">0</strong>
        </div>
        <div class="summary-card">
          <span>金</span>
          <strong id="summary-gold" class="text-gold">0</strong>
        </div>
      </div>

      <div class="controls-group">
        <input id="card-count-input" type="number" placeholder="輸入數量" min="1" />
        <button id="start-card-btn">開始抽卡</button>
      </div>

      <div class="table-container mt-4">
        <table>
          <thead>
            <tr>
              <th>白</th>
              <th>綠</th>
              <th>藍</th>
              <th>紫</th>
              <th>金</th>
            </tr>
          </thead>
          <tbody id="card-result-tbody">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>

</html>
